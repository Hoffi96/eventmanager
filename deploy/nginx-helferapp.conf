# nginx-Reverse-Proxy für Helfer-Tasks.
# Installation: siehe deploy/README.md
# TLS-Zertifikat z. B. per certbot (Let's Encrypt) erzeugen:
#   sudo certbot --nginx -d helfer.example.com

server {
    listen 80;
    server_name helfer.example.com;

    # certbot leitet diesen Block bei Bedarf automatisch auf 443 um.

    client_max_body_size 12m;  # etwas über dem 10-MB-Anhang-Limit der App

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-Unterstützung (aktuell nicht genutzt, schadet aber nicht)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection keep-alive;
    }
}
